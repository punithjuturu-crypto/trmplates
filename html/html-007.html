```html
<!DOCTYPE html>
<html>
<head>
    <title>Frames and Iframes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: lightgray;
            margin: 0;
        }

        h1 {
            background-color: darkblue;
            color: white;
            padding: 20px;
            margin: 0;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: 3px solid black;
        }
    </style>
</head>

<body>

    <h1>Webpage Using Iframe</h1>

    <div class="container">

        <h2>Google</h2>

        <iframe
            src="https://www.example.com"
            title="Example Website">
        </iframe>

        <h2>Local HTML Page</h2>

        <iframe
            src="question1.html"
            title="My HTML Page">
        </iframe>

    </div>

</body>
</html>
```
