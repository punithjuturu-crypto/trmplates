```html
<!DOCTYPE html>
<html>
<head>
    <title>Images and Hyperlinks</title>
</head>

<body>

    <h1>Images and Hyperlinks</h1>

    <h2>My Favorite Image</h2>

    <!-- Image -->
    <img src="https://picsum.photos/400/250"
         alt="Sample Image"
         width="400"
         height="250">

    <br><br>

    <h2>Useful Websites</h2>

    <!-- Hyperlinks -->
    <a href="https://www.google.com" target="_blank">
        Visit Google
    </a>

    <br><br>

    <a href="https://www.youtube.com" target="_blank">
        Visit YouTube
    </a>

    <br><br>

    <a href="https://www.wikipedia.org" target="_blank">
        Visit Wikipedia
    </a>

    <h2>Image as a Hyperlink</h2>

    <!-- Image inside a hyperlink -->
    <a href="https://www.google.com" target="_blank">
        <img src="https://picsum.photos/250/150"
             alt="Click to visit Google"
             width="250"
             height="150">
    </a>

    <p>Click the image above to open Google.</p>

</body>
</html>
```
