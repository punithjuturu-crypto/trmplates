```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Internal and External CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            color: darkblue;
            text-align: center;
        }

        .internal {
            color: green;
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>Internal and External CSS</h1>

    <p class="internal">
        This paragraph is styled using Internal CSS.
    </p>

    <div class="box">
        <h2>External CSS Example</h2>
        <p>
            This box is styled using an External CSS file.
        </p>
        <button>Click Me</button>
    </div>

</body>
</html>
```
