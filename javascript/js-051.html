<!DOCTYPE html>
<html>
<head>
    <title>Armstrong Number</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding-top: 70px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Armstrong Number</h1>

    <input type="number"
           id="number"
           placeholder="Enter a number">

    <button onclick="checkArmstrong()">
        Check
    </button>

    <div id="result"></div>

</div>

<script>

function checkArmstrong() {

    let number =
        Number(document.getElementById("number").value);

    if (!Number.isInteger(number) || number < 0) {
        document.getElementById("result").innerHTML =
            "Please enter a positive integer.";
        return;
    }

    let original = number;
    let digits = String(number).length;
    let sum = 0;
    let temp = number;

    while (temp > 0) {

        let digit = temp % 10;

        sum += Math.pow(digit, digits);

        temp = Math.floor(temp / 10);
    }

    // 0 is an Armstrong number
    if (number === 0) {
        sum = 0;
    }

    if (sum === original) {

        document.getElementById("result").innerHTML =
            number + " is an Armstrong number.";

    } else {

        document.getElementById("result").innerHTML =
            number + " is not an Armstrong number.";
    }
}

</script>

</body>
</html>
