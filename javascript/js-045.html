<!DOCTYPE html>
<html>
<head>
    <title>Local Storage</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            color: white;
            background: blue;
            cursor: pointer;
        }

        .clear {
            background: red;
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            background: #eee;
            line-height: 2;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Local Storage</h1>

    <input type="text"
           id="name"
           placeholder="Enter your name">

    <input type="text"
           id="course"
           placeholder="Enter your course">

    <br>

    <button onclick="saveData()">
        Save Data
    </button>

    <button onclick="getData()">
        Retrieve Data
    </button>

    <button class="clear" onclick="clearData()">
        Clear Data
    </button>

    <div id="output"></div>

</div>

<script>

function saveData() {

    let name =
        document.getElementById("name").value;

    let course =
        document.getElementById("course").value;

    if (name === "" || course === "") {

        alert("Please enter all details.");

        return;
    }

    // Store data
    localStorage.setItem("studentName", name);

    localStorage.setItem("studentCourse", course);

    document.getElementById("output").innerHTML =
        "Data saved successfully!";
}


function getData() {

    // Retrieve data
    let name =
        localStorage.getItem("studentName");

    let course =
        localStorage.getItem("studentCourse");

    if (name === null || course === null) {

        document.getElementById("output").innerHTML =
            "No data found.";

        return;
    }

    document.getElementById("output").innerHTML =

        "<b>Student Name:</b> " + name +

        "<br><b>Course:</b> " + course;
}


function clearData() {

    localStorage.removeItem("studentName");

    localStorage.removeItem("studentCourse");

    document.getElementById("output").innerHTML =
        "Data cleared successfully!";
}

</script>

</body>
</html>
