<!DOCTYPE html>
<html>
<head>
    <title>Palindrome Checker</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding-top: 60px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Palindrome Checker</h1>

    <input type="text"
           id="text"
           placeholder="Enter a string">

    <br>

    <button onclick="checkPalindrome()">
        Check
    </button>

    <div id="result"></div>

</div>

<script>

function checkPalindrome() {

    let text =
        document.getElementById("text").value;

    // Remove spaces and convert to lowercase
    let cleanedText =
        text.toLowerCase().replace(/\s/g, "");

    let reversed =
        cleanedText.split("").reverse().join("");

    if (cleanedText === reversed) {

        document.getElementById("result").innerHTML =
            "It is a Palindrome.";

    } else {

        document.getElementById("result").innerHTML =
            "It is not a Palindrome.";
    }
}

</script>

</body>
</html>
