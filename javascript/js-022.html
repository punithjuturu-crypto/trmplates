<!DOCTYPE html>
<html>
<head>
    <title>Change Text</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f8fafc;
        }

        h1 {
            color: #2563eb;
        }

        #text {
            font-size: 25px;
            margin: 30px;
        }

        button {
            padding: 12px 25px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Changing Text Using JavaScript</h1>

    <p id="text">
        This is the original text.
    </p>

    <button onclick="changeText()">
        Change Text
    </button>

    <script>

        function changeText() {

            document.getElementById("text").textContent =
                "The text has been changed successfully!";

        }

    </script>

</body>
</html>
