<!DOCTYPE html>
<html>
<head>
    <title>Fetch API</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 40px;
            text-align: center;
        }

        .container {
            width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        button {
            padding: 12px 20px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            text-align: left;
        }

        .user {
            background: #eee;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Fetch API Example</h1>

    <button onclick="fetchUsers()">
        Fetch Users
    </button>

    <div id="output"></div>

</div>

<script>

function fetchUsers() {

    document.getElementById("output").innerHTML =
        "Loading data...";

    fetch("https://jsonplaceholder.typicode.com/users")

        .then(response => {

            if (!response.ok) {
                throw new Error("Network response was not OK");
            }

            return response.json();

        })

        .then(data => {

            document.getElementById("output").innerHTML =
                "<h2>Users</h2>";

            data.forEach(user => {

                document.getElementById("output").innerHTML +=
                    `
                    <div class="user">
                        <b>Name:</b> ${user.name}<br>
                        <b>Email:</b> ${user.email}<br>
                        <b>City:</b> ${user.address.city}
                    </div>
                    `;
            });

        })

        .catch(error => {

            document.getElementById("output").innerHTML =
                "Error: " + error.message;

        });
}

</script>

</body>
</html>
