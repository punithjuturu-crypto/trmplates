<!DOCTYPE html>
<html>
<head>
    <title>Dynamic API Data</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 25px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        #products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 8px gray;
        }

        .card h3 {
            color: blue;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            #products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<h1>Products from API</h1>

<button onclick="loadProducts()">
    Load Products
</button>

<div id="products"></div>

<script>

async function loadProducts() {

    const productsContainer =
        document.getElementById("products");

    productsContainer.innerHTML =
        "<p>Loading products...</p>";

    try {

        const response =
            await fetch("https://dummyjson.com/products");

        const data = await response.json();

        productsContainer.innerHTML = "";

        data.products.forEach(product => {

            const card = document.createElement("div");

            card.className = "card";

            card.innerHTML = `
                <h3>${product.title}</h3>

                <p>${product.description}</p>

                <p class="price">
                    Price: $${product.price}
                </p>

                <p>
                    Category: ${product.category}
                </p>

                <p>
                    Rating: ${product.rating}
                </p>
            `;

            productsContainer.appendChild(card);
        });

    } catch (error) {

        productsContainer.innerHTML =
            "<p>Unable to load products.</p>";
    }
}

</script>

</body>
</html>
