<!DOCTYPE html>
<html>
<head>
    <title>Word Count</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding-top: 60px;
        }

        .container {
            width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        textarea {
            width: 90%;
            height: 120px;
            padding: 12px;
            margin: 10px;
            font-size: 16px;
            resize: none;
        }

        button {
            padding: 12px 25px;
            background: orange;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Word Counter</h1>

    <textarea id="text"
              placeholder="Enter a sentence"></textarea>

    <br>

    <button onclick="countWords()">
        Count Words
    </button>

    <div id="result"></div>

</div>

<script>

function countWords() {

    let text =
        document.getElementById("text").value.trim();

    if (text === "") {

        document.getElementById("result").innerHTML =
            "Number of words: 0";

        return;
    }

    let words = text.split(/\s+/);

    document.getElementById("result").innerHTML =
        "Number of words: " + words.length;
}

</script>

</body>
</html>
