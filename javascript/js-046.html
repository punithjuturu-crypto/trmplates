<!DOCTYPE html>
<html>
<head>
    <title>Responsive Login Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4c63c7;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }

        @media (max-width: 500px) {
            .login-box {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Login</h1>

    <form onsubmit="return validateLogin()">

        <label>Email</label>

        <input type="email"
               id="email"
               placeholder="Enter your email">

        <label>Password</label>

        <input type="password"
               id="password"
               placeholder="Enter your password">

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

</div>

<script>

function validateLogin() {

    let email =
        document.getElementById("email").value.trim();

    let password =
        document.getElementById("password").value;

    let message =
        document.getElementById("message");

    let emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (email === "") {

        message.style.color = "red";
        message.innerHTML = "Please enter your email.";

        return false;
    }

    if (!emailPattern.test(email)) {

        message.style.color = "red";
        message.innerHTML = "Enter a valid email address.";

        return false;
    }

    if (password === "") {

        message.style.color = "red";
        message.innerHTML = "Please enter your password.";

        return false;
    }

    if (password.length < 6) {

        message.style.color = "red";
        message.innerHTML =
            "Password must contain at least 6 characters.";

        return false;
    }

    message.style.color = "green";
    message.innerHTML = "Login successful!";

    return false;
}

</script>

</body>
</html>
