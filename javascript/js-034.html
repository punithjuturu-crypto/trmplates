<!DOCTYPE html>
<html>
<head>
    <title>Counter Application</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding-top: 80px;
            background: #f2f2f2;
        }

        .counter {
            width: 350px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        #count {
            font-size: 60px;
            margin: 20px;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        .increment {
            background: green;
            color: white;
        }

        .decrement {
            background: red;
            color: white;
        }

        .reset {
            background: blue;
            color: white;
        }
    </style>
</head>

<body>

<div class="counter">

    <h1>Counter</h1>

    <div id="count">0</div>

    <button class="increment" onclick="increment()">
        +
    </button>

    <button class="decrement" onclick="decrement()">
        -
    </button>

    <button class="reset" onclick="resetCounter()">
        Reset
    </button>

</div>

<script>

let count = 0;

function increment() {
    count++;
    displayCount();
}

function decrement() {
    count--;
    displayCount();
}

function resetCounter() {
    count = 0;
    displayCount();
}

function displayCount() {
    document.getElementById("count").innerHTML = count;
}

</script>

</body>
</html>
