<!DOCTYPE html>
<html>
<head>
    <title>Reverse a String</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding-top: 60px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Reverse a String</h1>

    <input type="text"
           id="text"
           placeholder="Enter a string">

    <br>

    <button onclick="reverseString()">
        Reverse
    </button>

    <div id="result"></div>

</div>

<script>

function reverseString() {

    let text =
        document.getElementById("text").value;

    let reversed = text.split("").reverse().join("");

    document.getElementById("result").innerHTML =
        "Reversed String: " + reversed;
}

</script>

</body>
</html>
