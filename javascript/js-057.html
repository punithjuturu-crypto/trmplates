<!DOCTYPE html>
<html>
<head>
    <title>Remove Duplicates</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding-top: 60px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
        }

        button {
            padding: 12px 25px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            line-height: 2;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Remove Duplicate Elements</h1>

    <input type="text"
           id="array"
           placeholder="Example: 10,20,10,30,20,40">

    <button onclick="removeDuplicates()">
        Remove Duplicates
    </button>

    <div id="result"></div>

</div>

<script>

function removeDuplicates() {

    let input =
        document.getElementById("array").value;

    let arr = input.split(",").map(item => item.trim());

    let uniqueArray = [...new Set(arr)];

    document.getElementById("result").innerHTML =

        "<b>Original Array:</b> " +
        arr.join(", ") +

        "<br><b>After Removing Duplicates:</b> " +
        uniqueArray.join(", ");
}

</script>

</body>
</html>
