<!DOCTYPE html>
<html>
<head>
    <title>Positive Negative Zero</title>
</head>

<body>

    <h1>Check Number</h1>

    <p id="output"></p>

    <script>

        let number = -23;

        if (number > 0) {

            document.getElementById("output").innerHTML =
                number + " is a Positive Number";

        }
        else if (number < 0) {

            document.getElementById("output").innerHTML =
                number + " is a Negative Number";

        }
        else {

            document.getElementById("output").innerHTML =
                "The number is Zero";

        }

    </script>

</body>
</html>
