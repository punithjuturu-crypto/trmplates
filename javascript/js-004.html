<!DOCTYPE html>
<html>
<head>
    <title>Even or Odd</title>
</head>

<body>

    <h1>Check Even or Odd</h1>

    <p id="output"></p>

    <script>

        let number = 30;

        if (number % 2 === 0) {
            document.getElementById("output").innerHTML =
                number + " is an Even Number";
        }
        else {
            document.getElementById("output").innerHTML =
                number + " is an Odd Number";
        }

    </script>

</body>
</html>
