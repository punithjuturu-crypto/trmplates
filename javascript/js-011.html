<!DOCTYPE html>
<html>
<head>
    <title>Sum of Digits</title>
</head>

<body>

    <h1>Sum of Digits</h1>

    <p id="output"></p>

    <script>

        let number = 8765;
        let original = number;
        let sum = 0;

        while (number > 0) {

            let digit = number % 10;

            sum = sum + digit;

            number = Math.floor(number / 10);
        }

        document.getElementById("output").innerHTML =
            "Number = " + original + "<br>" +
            "Sum of Digits = " + sum;

    </script>

</body>
</html>
