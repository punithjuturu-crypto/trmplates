<!DOCTYPE html>
<html>
<head>
    <title>Spread and Rest Operators</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 50px;
            text-align: center;
        }

        .container {
            width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        button {
            padding: 12px 20px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            text-align: left;
            line-height: 2;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Spread and Rest Operators</h1>

    <button onclick="demonstrate()">
        Run Program
    </button>

    <div id="output"></div>

</div>

<script>

function demonstrate() {

    // Spread Operator

    let fruits1 = ["Apple", "Banana", "Mango"];

    let fruits2 = ["Orange", "Grapes"];

    let allFruits = [...fruits1, ...fruits2];


    // Spread operator with objects

    let student = {
        name: "Rahul",
        age: 20
    };

    let studentDetails = {
        ...student,
        course: "Computer Science"
    };


    // Rest Operator

    function calculateSum(...numbers) {

        let total = 0;

        for (let number of numbers) {
            total += number;
        }

        return total;
    }

    let result =
        calculateSum(10, 20, 30, 40, 50);


    document.getElementById("output").innerHTML =

        "<b>Array 1:</b> " +
        fruits1.join(", ") +

        "<br><b>Array 2:</b> " +
        fruits2.join(", ") +

        "<br><b>Spread Result:</b> " +
        allFruits.join(", ") +

        "<br><br><b>Object using Spread:</b> " +
        JSON.stringify(studentDetails) +

        "<br><br><b>Rest Operator:</b> " +
        "Sum = " + result;
}

</script>

</body>
</html>
