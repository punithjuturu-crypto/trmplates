<!DOCTYPE html>
<html>
<head>
    <title>Vowels and Consonants</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding-top: 60px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            background: purple;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            line-height: 2;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Vowels and Consonants</h1>

    <input type="text"
           id="text"
           placeholder="Enter a string">

    <br>

    <button onclick="countLetters()">
        Count
    </button>

    <div id="result"></div>

</div>

<script>

function countLetters() {

    let text =
        document.getElementById("text").value.toLowerCase();

    let vowels = 0;
    let consonants = 0;

    for (let char of text) {

        if (/[a-z]/.test(char)) {

            if ("aeiou".includes(char)) {
                vowels++;
            } else {
                consonants++;
            }
        }
    }

    document.getElementById("result").innerHTML =

        "Vowels: " + vowels +
        "<br>Consonants: " + consonants;
}

</script>

</body>
</html>
