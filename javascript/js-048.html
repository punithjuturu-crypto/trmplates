<!DOCTYPE html>
<html>
<head>
    <title>Swap Two Numbers</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding-top: 70px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
        }

        button {
            padding: 12px 25px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Swap Two Numbers</h1>

    <input type="number"
           id="num1"
           placeholder="Enter first number">

    <input type="number"
           id="num2"
           placeholder="Enter second number">

    <button onclick="swapNumbers()">
        Swap
    </button>

    <div id="result"></div>

</div>

<script>

function swapNumbers() {

    let a =
        Number(document.getElementById("num1").value);

    let b =
        Number(document.getElementById("num2").value);

    let temp = a;

    a = b;

    b = temp;

    document.getElementById("result").innerHTML =
        "After Swapping:<br>" +
        "First Number = " + a +
        "<br>Second Number = " + b;
}

</script>

</body>
</html>
