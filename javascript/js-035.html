<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>

    <style>
        body {
            font-family: Arial;
            background: #786a2c;
            color: white;
            text-align: center;
            padding-top: 80px;
        }

        .stopwatch {
            width: 400px;
            margin: auto;
            padding: 30px;
            background: #7c3fb1;
            border-radius: 15px;
        }

        #display {
            font-size: 55px;
            margin: 30px;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        .start {
            background: green;
            color: white;
        }

        .stop {
            background: red;
            color: white;
        }

        .reset {
            background: blue;
            color: white;
        }
    </style>
</head>

<body>

<div class="stopwatch">

    <h1>Stopwatch</h1>

    <div id="display">00:00:00</div>

    <button class="start" onclick="startStopwatch()">
        Start
    </button>

    <button class="stop" onclick="stopStopwatch()">
        Stop
    </button>

    <button class="reset" onclick="resetStopwatch()">
        Reset
    </button>

</div>

<script>

let seconds = 0;
let timer = null;

function updateDisplay() {

    let hours = Math.floor(seconds / 3600);

    let minutes = Math.floor((seconds % 3600) / 60);

    let secs = seconds % 60;

    hours = hours < 10 ? "0" + hours : hours;
    minutes = minutes < 10 ? "0" + minutes : minutes;
    secs = secs < 10 ? "0" + secs : secs;

    document.getElementById("display").innerHTML =
        hours + ":" + minutes + ":" + secs;
}

function startStopwatch() {

    if (timer !== null) {
        return;
    }

    timer = setInterval(function() {

        seconds++;

        updateDisplay();

    }, 1000);
}

function stopStopwatch() {

    clearInterval(timer);

    timer = null;
}

function resetStopwatch() {

    clearInterval(timer);

    timer = null;

    seconds = 0;

    updateDisplay();
}

</script>

</body>
</html>
