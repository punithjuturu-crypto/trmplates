<!DOCTYPE html>
<html>
<head>
    <title>Sort an Array</title>
</head>

<body>

    <h1>Array Sorting</h1>

    <p id="output"></p>

    <script>

        let numbers = [50, 20, 80, 10, 40, 30];

        let original = [...numbers];

        numbers.sort(function(a, b) {
            return a - b;
        });

        document.getElementById("output").innerHTML =
            "Original Array = " + original.join(", ") + "<br><br>" +
            "Sorted Array = " + numbers.join(", ");

    </script>

</body>
</html>
