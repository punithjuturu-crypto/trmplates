<!DOCTYPE html>
<html>
<head>
    <title>Reverse a Number</title>
</head>

<body>

    <h1>Reverse Number Program</h1>

    <p id="output"></p>

    <script>

        let number = 83452;

        let original = number;
        let reverse = 0;

        while (number > 0) {

            let digit = number % 10;

            reverse = reverse * 10 + digit;

            number = Math.floor(number / 10);
        }

        document.getElementById("output").innerHTML =
            "Original Number = " + original + "<br>" +
            "Reversed Number = " + reverse;

    </script>

</body>
</html>
