<!DOCTYPE html>
<html>
<head>
    <title>Change Image</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            margin-top: 50px;
        }

        img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border: 3px solid rgb(26, 14, 76);
            border-radius: 10px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Change Image</h1>

    <img id="myImage"
         src="https://picsum.photos/id/237/300/200"
         alt="Image">

    <br>

    <button onclick="changeImage()">Change Image</button>

    <script>
        function changeImage() {
            document.getElementById("myImage").src =
                "https://picsum.photos/id/1025/300/200";
        }
    </script>

</body>
</html>
