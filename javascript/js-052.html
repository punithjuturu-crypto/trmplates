<!DOCTYPE html>
<html>
<head>
    <title>Perfect Number</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding-top: 70px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Perfect Number</h1>

    <input type="number"
           id="number"
           placeholder="Enter a number">

    <button onclick="checkPerfect()">
        Check
    </button>

    <div id="result"></div>

</div>

<script>

function checkPerfect() {

    let number =
        Number(document.getElementById("number").value);

    if (!Number.isInteger(number) || number <= 0) {

        document.getElementById("result").innerHTML =
            "Please enter a positive integer.";

        return;
    }

    let sum = 0;

    for (let i = 1; i <= number / 2; i++) {

        if (number % i === 0) {
            sum += i;
        }
    }

    if (sum === number) {

        document.getElementById("result").innerHTML =
            number + " is a Perfect Number.";

    } else {

        document.getElementById("result").innerHTML =
            number + " is not a Perfect Number.";
    }
}

</script>

</body>
</html>
