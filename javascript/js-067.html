<!DOCTYPE html>
<html>
<head>
    <title>Email Validation</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
            text-align:center;
            padding-top:60px;
        }

        .container{
            width:450px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input{
            width:90%;
            padding:12px;
            margin:10px;
            font-size:16px;
        }

        button{
            padding:12px 25px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
        }

        #result{
            margin-top:20px;
            font-size:20px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Email Validation</h1>

    <input type="text"
           id="email"
           placeholder="Enter Email Address">

    <br>

    <button onclick="validateEmail()">
        Validate
    </button>

    <div id="result"></div>

</div>

<script>

function validateEmail(){

    let email =
        document.getElementById("email").value;

    let pattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(pattern.test(email)){

        document.getElementById("result").innerHTML =
            "Valid Email Address";

        document.getElementById("result").style.color =
            "green";

    }
    else{

        document.getElementById("result").innerHTML =
            "Invalid Email Address";

        document.getElementById("result").style.color =
            "red";
    }
}

</script>

</body>
</html>
