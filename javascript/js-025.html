<!DOCTYPE html>
<html>
<head>
    <title>Show and Hide Element</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px;
            background: #f8fafc;
        }

        #box {
            background: #dbeafe;
            padding: 40px;
            margin: 30px auto;
            max-width: 500px;

            border-radius: 10px;

            font-size: 20px;
        }

        button {
            padding: 12px 25px;

            margin: 10px;

            border: none;
            border-radius: 6px;

            color: white;
            cursor: pointer;
        }

        .show {
            background: #16a34a;
        }

        .hide {
            background: #dc2626;
        }
    </style>
</head>

<body>

    <h1>Show / Hide HTML Element</h1>

    <div id="box">
        👋 Hello! This is an HTML element.
        <br><br>
        You can show or hide me using JavaScript.
    </div>

    <button class="hide" onclick="hideElement()">
        Hide
    </button>

    <button class="show" onclick="showElement()">
        Show
    </button>

    <script>

        function hideElement() {

            document.getElementById("box")
                .style.display = "none";

        }


        function showElement() {

            document.getElementById("box")
                .style.display = "block";

        }

    </script>

</body>
</html>
