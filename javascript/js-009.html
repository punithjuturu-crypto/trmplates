<!DOCTYPE html>
<html>
<head>
    <title>Palindrome Number</title>
</head>

<body>

    <h1>Palindrome Number Check</h1>

    <p id="output"></p>

    <script>

        let number = 121;

        let original = number;
        let reverse = 0;

        while (number > 0) {

            let digit = number % 10;

            reverse = reverse * 10 + digit;

            number = Math.floor(number / 10);
        }

        if (original === reverse) {

            document.getElementById("output").innerHTML =
                original + " is a Palindrome Number";

        }
        else {

            document.getElementById("output").innerHTML =
                original + " is Not a Palindrome Number";

        }

    </script>

</body>
</html>
