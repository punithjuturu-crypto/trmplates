```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Navigation Menu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Navigation Bar */
        .navbar {
            background-color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .menu li a {
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            display: block;
        }

        .menu li a:hover {
            background-color: #555;
        }

        .content {
            text-align: center;
            padding: 60px 20px;
            background-color: #f2f2f2;
        }

        /* Mobile */
        @media screen and (max-width: 600px) {

            .navbar {
                flex-direction: column;
            }

            .logo {
                margin-bottom: 10px;
            }

            .menu {
                flex-direction: column;
                width: 100%;
                text-align: center;
            }

            .menu li a {
                border-top: 1px solid #555;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            MyWebsite
        </div>

        <ul class="menu">

            <li>
                <a href="#">Home</a>
            </li>

            <li>
                <a href="#">About</a>
            </li>

            <li>
                <a href="#">Services</a>
            </li>

            <li>
                <a href="#">Portfolio</a>
            </li>

            <li>
                <a href="#">Contact</a>
            </li>

        </ul>

    </nav>

    <div class="content">

        <h1>Welcome to My Website</h1>

        <p>
            How can i help you ?
        </p>

    </div>

</body>
</html>
```
