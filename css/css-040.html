<!DOCTYPE html>
<html>
<head>
    <title>Image Hover Effect</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            padding: 40px;
        }

        .image-container {
            display: inline-block;
            overflow: hidden;
            width: 400px;
            height: 280px;
            border-radius: 15px;
            box-shadow: 0 5px 15px gray;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .image-container img:hover {
            transform: scale(1.2);
        }

        h1 {
            margin-bottom: 30px;
        }
    </style>
</head>

<body>

    <h1>CSS Image Hover Effect</h1>

    <div class="image-container">
        <img src="https://picsum.photos/400/280" alt="Sample Image">
    </div>

    <p>Move your mouse over the image.</p>

</body>
</html>
