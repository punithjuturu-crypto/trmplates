<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Typography</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 8vw;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 50px 20px;
        }

        .container h2 {
            font-size: 5vw;
            margin-bottom: 20px;
            color: #2563eb;
        }

        .container p {
            font-size: 2vw;
            line-height: 1.7;
        }

        .card {
            margin-top: 40px;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px #ccc;
        }

        /* Tablet */

        @media (max-width: 800px) {

            header h1 {
                font-size: 10vw;
            }

            .container h2 {
                font-size: 7vw;
            }

            .container p {
                font-size: 4vw;
            }
        }

        /* Mobile */

        @media (max-width: 500px) {

            header h1 {
                font-size: 12vw;
            }

            .container h2 {
                font-size: 9vw;
            }

            .container p {
                font-size: 5vw;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Responsive Typography</h1>
</header>

<div class="container">

    <div class="card">
        <h2>Responsive Heading</h2>

        <p>
            The size of the text changes according to the
            screen size. Resize your browser window to see
            the difference.
        </p>
    </div>

    <div class="card">
        <h2>Responsive Paragraph</h2>

        <p>
            Responsive typography makes websites easier to
            read on mobile phones, tablets and desktop
            computers.
        </p>
    </div>

</div>

</body>
</html>
