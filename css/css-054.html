<!DOCTYPE html>
<html>
<head>
    <title>Responsive Contact Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .contact-container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 15px gray;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .contact-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 16px;
        }

        .form-group textarea {
            height: 150px;
            resize: vertical;
        }

        .full-width {
            grid-column: 1 / 3;
        }

        .submit-button {
            background: blue;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-button:hover {
            background: darkblue;
        }

        @media (max-width: 600px) {
            .contact-container {
                margin: 20px;
                padding: 25px;
            }

            .contact-form {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: 1;
            }
        }
    </style>
</head>

<body>

    <div class="contact-container">

        <h1>Contact Us</h1>

        <form class="contact-form">

            <div class="form-group">
                <label>Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="tel" placeholder="Enter your phone number">
            </div>

            <div class="form-group">
                <label>Subject</label>
                <input type="text" placeholder="Enter subject">
            </div>

            <div class="form-group full-width">
                <label>Message</label>
                <textarea placeholder="Enter your message"></textarea>
            </div>

            <div class="form-group full-width">
                <button class="submit-button" type="submit">
                    Send Message
                </button>
            </div>

        </form>

    </div>

</body>
</html>
