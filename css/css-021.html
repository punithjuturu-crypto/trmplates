<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .profile {
            width: 700px;
            max-width: 90%;
            margin: 50px auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px gray;
            overflow: hidden;
        }

        .header {
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            background-color: white;
            border: 5px solid lightblue;
            border-radius: 50%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: darkblue;
            font-size: 40px;
            font-weight: bold;
        }

        .header h1 {
            margin-bottom: 5px;
        }

        .details {
            padding: 30px;
        }

        .details h2 {
            color: darkblue;
            border-bottom: 2px solid darkblue;
            padding-bottom: 8px;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .info p {
            margin: 5px;
            padding: 12px;
            background-color: #f5f5f5;
            border-left: 4px solid darkblue;
        }

        .skills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .skill {
            background-color: lightblue;
            padding: 10px 18px;
            border-radius: 20px;
        }

        @media screen and (max-width: 600px) {
            .info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
