<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS clamp min max</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
        }

        header {
            background: #4f46e5;
            color: white;
            text-align: center;

            /* clamp() */

            padding: clamp(25px, 5vw, 80px);
        }

        header h1 {
            /*
                Minimum: 30px
                Preferred: 8vw
                Maximum: 70px
            */

            font-size: clamp(30px, 8vw, 70px);
        }

        .container {
            /*
                Width will never be larger than 1000px.
            */

            width: min(90%, 1000px);

            margin: 40px auto;
        }

        .card {
            background: white;

            /*
                Width is at least 250px
                and at most 500px.
            */

            width: min(100%, 500px);

            /*
                Padding cannot be smaller than 20px.
            */

            padding: max(20px, 3vw);

            margin: 30px auto;

            border-radius: 12px;
            box-shadow: 0 4px 12px #bbb;
        }

        .card h2 {
            color: #4f46e5;

            font-size: clamp(22px, 4vw, 40px);

            margin-bottom: 15px;
        }

        .card p {
            font-size: clamp(16px, 2vw, 20px);
            line-height: 1.6;
        }
    </style>
</head>

<body>

<header>

    <h1>CSS Functions</h1>

    <p>clamp() • min() • max()</p>

</header>

<div class="container">

    <div class="card">

        <h2>clamp()</h2>

        <p>
            clamp() allows a value to have a minimum,
            preferred and maximum size.
        </p>

    </div>

    <div class="card">

        <h2>min()</h2>

        <p>
            min() selects the smallest value from
            the provided values.
        </p>

    </div>

    <div class="card">

        <h2>max()</h2>

        <p>
            max() selects the largest value from
            the provided values.
        </p>

    </div>

</div>

</body>
</html>
