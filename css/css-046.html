<!DOCTYPE html>
<html>
<head>
    <title>Card Layout Using Flexbox</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        h1 {
            text-align: center;
            padding: 25px;
        }

        .card-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            padding: 30px;
        }

        .card {
            background: white;
            width: 250px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 10px gray;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h2 {
            margin: 15px 0 10px;
        }

        .card p {
            color: #555;
        }

        .card button {
            background: blue;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .card button:hover {
            background: darkblue;
        }
    </style>
</head>

<body>

    <h1>Card-Based Layout Using Flexbox</h1>

    <div class="card-container">

        <div class="card">
            <img src="https://picsum.photos/id/1015/250/150">
            <h2>HTML</h2>
            <p>Learn the basics of HTML and webpage structure.</p>
            <button>Learn More</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/1016/250/150">
            <h2>CSS</h2>
            <p>Learn how to style and design webpages using CSS.</p>
            <button>Learn More</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/1018/250/150">
            <h2>JavaScript</h2>
            <p>Learn programming and webpage interaction.</p>
            <button>Learn More</button>
        </div>

    </div>

</body>
</html>
