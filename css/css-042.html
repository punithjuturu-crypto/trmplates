<!DOCTYPE html>
<html>
<head>
    <title>CSS Button Hover Animation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 100px;
            background: #f2f2f2;
        }

        .animated-button {
            padding: 15px 35px;
            font-size: 18px;
            background: blue;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;

            transition: all 0.4s ease;
        }

        .animated-button:hover {
            background: darkblue;
            transform: translateY(-8px);
            box-shadow: 0 10px 20px gray;
        }

        .animated-button:active {
            transform: translateY(2px);
            box-shadow: 0 3px 5px gray;
        }
    </style>
</head>

<body>

    <h1>CSS Button Hover Animation</h1>

    <button class="animated-button">
        Hover Me
    </button>

</body>
</html>
