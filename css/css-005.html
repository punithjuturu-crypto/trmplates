<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Box Model</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: darkblue;
        }

        /* Outer area - Margin */
        .box {
            width: 400px;
            margin: 50px auto;       /* Margin */

            /* Border */
            border: 10px solid darkblue;

            /* Padding */
            padding: 30px;

            /* Content */
            background-color: lightblue;
        }

        .content {
            background-color: white;
            padding: 20px;
            font-size: 20px;
        }

        .label {
            font-weight: bold;
            color: darkred;
        }

    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <p>
        The CSS Box Model consists of Content, Padding,
        Border, and Margin.
    </p>

    <div class="box">

        <div class="content">
            <p class="label">CONTENT</p>

            <p>
                This is the content area of the box.
            </p>
        </div>

        <p class="label">PADDING → Space around the content</p>

    </div>

    <p>
        <strong>Border:</strong> The line surrounding the padding.
        <br>
        <strong>Margin:</strong> The space outside the border.
    </p>

</body>
</html>
