```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Webpage</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        header {
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 30px;
        }

        nav {
            background-color: #333;
            display: flex;
            justify-content: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px 25px;
        }

        nav a:hover {
            background-color: #555;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 30px;
            max-width: 1000px;
            margin: auto;
        }

        .box {
            flex: 1;
            background-color: white;
            padding: 25px;
            border: 2px solid darkblue;
            text-align: center;
        }

        /* Tablet */
        @media screen and (max-width: 768px) {

            .container {
                flex-direction: column;
            }

            header h1 {
                font-size: 28px;
            }
        }

        /* Mobile */
        @media screen and (max-width: 480px) {

            header {
                padding: 20px;
            }

            header h1 {
                font-size: 22px;
            }

            nav {
                flex-direction: column;
                text-align: center;
            }

            .container {
                padding: 15px;
            }

            .box {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Responsive Webpage</h1>
        <p>Resize the browser window</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">

        <div class="box">
            <h2>HTML</h2>
            <p>HTML creates the structure of a webpage.</p>
        </div>

        <div class="box">
            <h2>CSS</h2>
            <p>CSS is used to style webpages.</p>
        </div>

        <div class="box">
            <h2>JavaScript</h2>
            <p>JavaScript adds interactivity.</p>
        </div>

    </div>

</body>
</html>
```
