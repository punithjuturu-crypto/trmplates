<!DOCTYPE html>
<html>
<head>
    <title>Responsive Footer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .content {
            min-height: 500px;
            padding: 50px;
            text-align: center;
        }

        footer {
            background: #222;
            color: white;
            padding: 40px 30px 20px;
        }

        .footer-container {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1100px;
            margin: auto;
        }

        .footer-column {
            flex: 1;
            min-width: 200px;
        }

        .footer-column h3 {
            margin-bottom: 15px;
        }

        .footer-column a {
            display: block;
            color: white;
            text-decoration: none;
            margin: 10px 0;
        }

        .footer-column a:hover {
            text-decoration: underline;
        }

        .copyright {
            text-align: center;
            border-top: 1px solid #555;
            margin-top: 30px;
            padding-top: 20px;
        }

        @media (max-width: 600px) {
            .footer-container {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="content">
        <h1>Responsive Footer Example</h1>
        <p>
            Resize the browser window to see the responsive footer.
        </p>
    </div>

    <footer>

        <div class="footer-container">

            <div class="footer-column">
                <h3>About Us</h3>
                <p>
                    We provide educational resources for students.
                </p>
            </div>

            <div class="footer-column">
                <h3>Quick Links</h3>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Courses</a>
                <a href="#">Contact</a>
            </div>

            <div class="footer-column">
                <h3>Contact</h3>
                <p>Email: info@example.com</p>
                <p>Phone: 98xxxxxx</p>
            </div>

        </div>

        <div class="copyright">
            <p>© 2026 My Website. All Rights Reserved.</p>
        </div>

    </footer>

</body>
</html>
