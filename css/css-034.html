```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Opacity and Transparency</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: darkblue;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .box {
            width: 200px;
            height: 180px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        /* Full Opacity */
        .normal {
            background-color: rgb(0, 100, 200);
            opacity: 1;
        }

        /* 70% Opacity */
        .medium {
            background-color: rgb(0, 100, 200);
            opacity: 0.7;
        }

        /* 40% Opacity */
        .low {
            background-color: rgb(0, 100, 200);
            opacity: 0.4;
        }

        /* 20% Opacity */
        .very-low {
            background-color: rgb(0, 100, 200);
            opacity: 0.2;
        }

        /* RGBA Transparency */
        .transparent {
            background-color: rgba(255, 0, 0, 0.5);
            color: black;
        }

    </style>
</head>

<body>

    <h1>CSS Opacity and Transparency</h1>

    <div class="container">

        <div class="box normal">
            Opacity: 12345
        </div>

        <div class="box medium">
            Opacity: 23456
        </div>

        <div class="box low">
            Opacity: 2334
        </div>

        <div class="box very-low">
            Opacity: 234
        </div>

        <div class="box transparent">
            RGBA Transparency
        </div>

    </div>

</body>
</html>
```
