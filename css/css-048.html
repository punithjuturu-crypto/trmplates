<!DOCTYPE html>
<html>
<head>
    <title>Two Column Layout Using CSS Grid</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            padding: 30px;
            background: #f2f2f2;
            min-height: 500px;
        }

        .main-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .sidebar {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .sidebar ul {
            padding-left: 20px;
        }

        .sidebar li {
            margin: 15px 0;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Two Column Webpage</h1>
    </header>

    <div class="container">

        <section class="main-content">
            <h2>Main Content</h2>

            <p>
                This is the main content area of the webpage.
                CSS Grid is used to create the two-column layout.
            </p>

            <p>
                The main column takes more space than the sidebar.
            </p>
        </section>

        <aside class="sidebar">
            <h2>Sidebar</h2>

            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Contact</li>
            </ul>
        </aside>

    </div>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
