<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Alignment and Ordering</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .container {
            height: 300px;

            display: flex;

            /* Main-axis alignment */
            justify-content: space-around;

            /* Cross-axis alignment */
            align-items: center;

            gap: 20px;

            background: white;
            padding: 20px;
            border: 3px solid #2563eb;
        }

        .box {
            width: 120px;
            height: 120px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #2563eb;
            color: white;
            font-size: 20px;
            border-radius: 10px;
        }

        /* Ordering property */
        .box1 {
            order: 3;
        }

        .box2 {
            order: 1;
        }

        .box3 {
            order: 4;
        }

        .box4 {
            order: 2;
        }

        .info {
            background: white;
            margin-top: 30px;
            padding: 25px;
        }

        .info p {
            margin: 10px 0;
        }
    </style>
</head>

<body>

<h1>Flexbox Alignment and Ordering</h1>

<div class="container">

    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2</div>
    <div class="box box3">Box 3</div>
    <div class="box box4">Box 4</div>

</div>

<div class="info">
    <h2>Properties Demonstrated</h2>

    <p><strong>display:</strong> flex</p>
    <p><strong>justify-content:</strong> space-around</p>
    <p><strong>align-items:</strong> center</p>
    <p><strong>gap:</strong> 20px</p>
    <p><strong>order:</strong> Changes the visual order of flex items.</p>
</div>

</body>
</html>
