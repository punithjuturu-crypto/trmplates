<!DOCTYPE html>
<html>
<head>
    <title>Z-Index and Stacking Order</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            position: relative;
            width: 500px;
            height: 350px;
            margin: 50px auto;
            border: 2px solid black;
        }

        .box {
            position: absolute;
            width: 200px;
            height: 150px;
            color: white;
            padding: 20px;
            font-size: 20px;
        }

        .box1 {
            background: red;
            top: 30px;
            left: 50px;
            z-index: 1;
        }

        .box2 {
            background: blue;
            top: 80px;
            left: 120px;
            z-index: 2;
        }

        .box3 {
            background: green;
            top: 130px;
            left: 190px;
            z-index: 3;
        }
    </style>
</head>

<body>

    <h1>CSS Z-Index and Stacking Order</h1>

    <div class="container">
        <div class="box box1">Red Box<br>Z-Index: 1</div>
        <div class="box box2">Blue Box<br>Z-Index: 2</div>
        <div class="box box3">Green Box<br>Z-Index: 3</div>
    </div>

</body>
</html>
