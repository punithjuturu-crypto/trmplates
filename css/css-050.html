<!DOCTYPE html>
<html>
<head>
    <title>Sticky Header</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            position: sticky;
            top: 0;
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
            z-index: 1000;
        }

        nav {
            background: #444;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            padding: 8px;
        }

        nav a:hover {
            background: #666;
        }

        .content {
            padding: 30px;
            line-height: 1.8;
        }

        .section {
            height: 500px;
            padding: 30px;
            margin-bottom: 20px;
            background: #f2f2f2;
            border: 1px solid #ddd;
        }

        .section:nth-child(even) {
            background: #e6e6e6;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <div class="content">

        <div class="section">
            <h2>Home</h2>
            <p>
                This is the home section. Scroll down to see
                our features
            </p>
        </div>

        <div class="section">
            <h2>About</h2>
            <p>
                This section contains information about the website.
            </p>
        </div>

        <div class="section">
            <h2>Services</h2>
            <p>
                We provide different services through our website.
            </p>
        </div>

        <div class="section">
            <h2>Contact</h2>
            <p>
                Contact us for more information.82xxxxxxxx.
            </p>
        </div>

    </div>

</body>
</html>
