<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Types of CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            color: darkblue;
            text-align: center;
            font-family: Georgia, serif;
        }

        .internal {
            color: green;
            font-size: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Inline CSS -->
    <h2 style="color: red; text-align: center;">
        Inline CSS Example
    </h2>

    <!-- Internal CSS -->
    <h1>
        Internal CSS Example
    </h1>

    <p class="internal">
        This paragraph is styled using Internal CSS.
    </p>

    <!-- External CSS -->
    <div class="external-box">

        <h2>External CSS Example</h2>

        <p>
            This box and its contents are styled using
            an External CSS file.
        </p>

        <button>Click Me</button>

    </div>

</body>
</html>
```
