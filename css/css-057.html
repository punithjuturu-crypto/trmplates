<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #2874f0;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        .search {
            padding: 12px;
            width: 300px;
            border: none;
            border-radius: 5px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .products {
            padding: 40px 8%;
        }

        .products h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .product-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .product {
            background: white;
            width: 230px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        .product .image {
            height: 150px;
            background: #e8f0fe;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 70px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .product h3 {
            margin-bottom: 10px;
        }

        .price {
            color: green;
            font-weight: bold;
            font-size: 20px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            background: #2874f0;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            margin-top: 30px;
            background: #172337;
            color: white;
            text-align: center;
            padding: 25px;
        }
    </style>
</head>

<body>

<header>
    <h1>ShopEasy</h1>

    <input class="search" type="text" placeholder="Search products">

    <nav>
        <a href="#">Home</a>
        <a href="#">Cart 🛒</a>
    </nav>
</header>

<section class="products">
    <h2>Featured Products</h2>

    <div class="product-container">

        <div class="product">
            <div class="image">📱</div>
            <h3>Smartphone</h3>
            <p>Latest Android smartphone</p>
            <p class="price">₹14,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <div class="image">💻</div>
            <h3>Laptop</h3>
            <p>Powerful laptop for students</p>
            <p class="price">₹79,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <div class="image">⌚</div>
            <h3>Smart Watch</h3>
            <p>Fitness and Bluetooth calling</p>
            <p class="price">₹2,499</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <div class="image">🎧</div>
            <h3>Headphones</h3>
            <p>Wireless headphones</p>
            <p class="price">₹1,299</p>
            <button>Add to Cart</button>
        </div>

    </div>
</section>

<footer>
    <p>© 2026 ShopEasy | Online Shopping Website</p>
</footer>

</body>
</html>
