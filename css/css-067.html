<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Keyframe Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 50px;
        }

        .box {
            width: 120px;
            height: 120px;
            background: #2563eb;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 50px auto;

            border-radius: 10px;

            animation: moveBox 4s infinite;
        }

        @keyframes moveBox {

            0% {
                transform: translateX(-250px);
                background: #2563eb;
            }

            25% {
                transform: translateX(0);
                background: #16a34a;
            }

            50% {
                transform: translateX(250px) rotate(180deg);
                background: #dc2626;
            }

            75% {
                transform: translateX(0) rotate(360deg);
                background: #9333ea;
            }

            100% {
                transform: translateX(-250px);
                background: #2563eb;
            }
        }

        .info {
            max-width: 700px;
            margin: 80px auto 0;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h1>CSS Keyframe Animation</h1>

<div class="box">
    Animate
</div>

<div class="info">

    <h2>@keyframes</h2>

    <p>
        CSS keyframes are used to define different stages
        of an animation.
    </p>

    <br>

    <p>
        The animation changes the position, rotation and
        background color of the box.
    </p>

</div>

</body>
</html>
