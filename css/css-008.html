```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float and Clear</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .box {
            width: 180px;
            height: 120px;
            float: left;
            margin: 10px;
            padding: 20px;
            background-color: lightblue;
            border: 2px solid blue;
            text-align: center;
        }

        .clear {
            clear: both;
            background-color: lightgreen;
            padding: 20px;
            margin-top: 20px;
            border: 2px solid green;
        }
    </style>
</head>

<body>

    <h1>Float and Clear Properties</h1>

    <div class="box">
        <h3>Box 1</h3>
        <p>Float Left</p>
    </div>

    <div class="box">
        <h3>Box 2</h3>
        <p>Float Left</p>
    </div>

    <div class="box">
        <h3>Box 3</h3>
        <p>Float Left</p>
    </div>

    <div class="clear">
        <h2>Clear Property</h2>
        <p>
            This section uses clear: both, so it appears
            below all the floated boxes.
        </p>
    </div>

</body>
</html>
```
