```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Grid Layout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .grid-container {
            width: 90%;
            margin: 30px auto;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;

            background-color: white;
            padding: 25px;
            border: 2px solid darkblue;
        }

        .box {
            background-color: lightblue;
            border: 2px solid blue;
            padding: 40px 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .box:nth-child(1) {
            grid-column: span 2;
        }

        .box:nth-child(4) {
            grid-row: span 2;
        }

        .box:hover {
            background-color: lightgreen;
        }

        /* Responsive Grid */
        @media screen and (max-width: 600px) {

            .grid-container {
                grid-template-columns: 1fr;
            }

            .box:nth-child(1) {
                grid-column: span 1;
            }

            .box:nth-child(4) {
                grid-row: span 1;
            }
        }
    </style>
</head>

<body>

    <h1>CSS Grid Layout</h1>

    <div class="grid-container">

        <div class="box">Daa</div>

        <div class="box">web tech</div>

        <div class="box">JavaScript</div>

        <div class="box">css</div>

        <div class="box">html</div>

        <div class="box">data science</div>

    </div>

</body>
</html>
```
