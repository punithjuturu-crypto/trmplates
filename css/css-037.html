<!DOCTYPE html>
<html>
<head>
    <title>CSS Display Properties</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        .block {
            display: block;
            background: lightblue;
            padding: 15px;
            margin: 10px;
        }

        .inline {
            display: inline;
            background: lightgreen;
            padding: 10px;
        }

        .inline-block {
            display: inline-block;
            background: orange;
            width: 150px;
            padding: 20px;
            margin: 10px;
        }

        .none {
            display: none;
            background: red;
            color: white;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Display Properties</h1>

    <h2>Block</h2>
    <div class="block">This is a block element.</div>
    <div class="block">Another block element.</div>

    <h2>Inline</h2>
    <span class="inline">Inline Element 1</span>
    <span class="inline">Inline Element 2</span>

    <h2>Inline-Block</h2>
    <div class="inline-block">Box 1</div>
    <div class="inline-block">Box 2</div>

    <h2>None</h2>
    <div class="none">This element is hidden using display: none.</div>

</body>
</html>
