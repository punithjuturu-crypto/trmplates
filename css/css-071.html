<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Using CSS Variables</title>

    <style>
        /* CSS Variables */

        :root {
            --background: #ffffff;
            --text: #222222;
            --primary: #2563eb;
            --card: #f1f5f9;
            --border: #dddddd;
        }

        /* Dark Mode Variables */

        body.dark {
            --background: #111827;
            --text: #f9fafb;
            --primary: #60a5fa;
            --card: #1f2937;
            --border: #374151;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);

            transition: 0.4s;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 20px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
        }

        .hero h1 {
            margin-bottom: 15px;
        }

        .cards {
            padding: 40px 8%;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 10px;
        }

        .card h2 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        footer {
            margin-top: 50px;
            background: var(--card);
            padding: 25px;
            text-align: center;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>My Website</h2>

    <button onclick="toggleDarkMode()">
        🌙 Dark Mode
    </button>
</header>

<section class="hero">
    <h1>CSS Variables</h1>
    <p>Click the button to switch between light and dark mode.</p>
</section>

<section class="cards">

    <div class="card">
        <h2>HTML</h2>
        <p>HTML creates the structure of a webpage.</p>
    </div>

    <div class="card">
        <h2>CSS</h2>
        <p>CSS controls the appearance and design.</p>
    </div>

    <div class="card">
        <h2>JavaScript</h2>
        <p>JavaScript adds interactivity.</p>
    </div>

</section>

<footer>
    <p>© 2026 My Website</p>
</footer>

<script>
    function toggleDarkMode() {
        document.body.classList.toggle("dark");
    }
</script>

</body>
</html>
