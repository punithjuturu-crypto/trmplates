<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Template Areas</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            min-height: 100vh;

            display: grid;

            grid-template-columns: 200px 1fr;
            grid-template-rows: 80px 1fr 60px;

            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
        }

        header {
            grid-area: header;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        aside {
            grid-area: sidebar;
            background: #1e293b;
            color: white;
            padding: 25px;
        }

        aside h3 {
            margin-bottom: 20px;
        }

        aside p {
            padding: 12px 0;
        }

        main {
            grid-area: main;
            padding: 30px;
            background: white;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: #dbeafe;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        footer {
            grid-area: footer;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr 60px;

                grid-template-areas:
                    "header"
                    "sidebar"
                    "main"
                    "footer";
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>My Dashboard</h1>
    </header>

    <aside>
        <h3>Menu</h3>
        <p>🏠 Home</p>
        <p>👤 Profile</p>
        <p>📊 Dashboard</p>
        <p>⚙️ Settings</p>
    </aside>

    <main>
        <h2>Dashboard</h2>
        <p>This layout is created using CSS Grid Template Areas.</p>

        <div class="cards">
            <div class="card">
                <h3>Students</h3>
                <p>500</p>
            </div>

            <div class="card">
                <h3>Courses</h3>
                <p>25</p>
            </div>

            <div class="card">
                <h3>Projects</h3>
                <p>120</p>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 My Dashboard</p>
    </footer>

</div>

</body>
</html>
