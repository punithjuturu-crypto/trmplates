<!DOCTYPE html>
<html>
<head>
    <title>Responsive Image Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        /* Tablet */
        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery img {
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Image Gallery</h1>

    <div class="gallery">

        <img src="https://picsum.photos/id/1015/500/400" alt="Image 1">
        <img src="https://picsum.photos/id/1016/500/400" alt="Image 2">
        <img src="https://picsum.photos/id/1018/500/400" alt="Image 3">
        <img src="https://picsum.photos/id/1020/500/400" alt="Image 4">
        <img src="https://picsum.photos/id/1024/500/400" alt="Image 5">
        <img src="https://picsum.photos/id/1025/500/400" alt="Image 6">
        <img src="https://picsum.photos/id/1035/500/400" alt="Image 7">
        <img src="https://picsum.photos/id/1039/500/400" alt="Image 8">

    </div>

</body>
</html>
